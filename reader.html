<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chwila czytania</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="reader.js"></script>
</head>
<body>
  <main>
    <header>
      <span>Chwila czytania</span>
      <a href="options.html" target="_blank" rel="noopener" data-i18n="settings">Ustawienia</a>
    </header>
    <section id="portal" class="portal" hidden aria-label="Dostęp do strony" data-i18n-aria-label="siteAccess">
      <p id="access" aria-live="polite"></p>
      <button id="enter" type="button" hidden data-i18n="openSite">Otwórz portal</button>
    </section>
    <article aria-labelledby="title">
      <h1 id="title"></h1>
      <div id="text"></div>
    </article>
    <nav aria-label="Nawigacja książki" data-i18n-aria-label="bookNav">
      <button id="previous" type="button" data-i18n="previousPage">Wstecz</button>
      <span id="page"></span>
      <button id="next" type="button" data-i18n="nextPage">Czytaj dalej</button>
    </nav>
  </main>
</body>
</html>
