<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chwila czytania</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="reader.js"></script>
</head>
<body>
  <main>
    <header>
      <span>Chwila czytania</span>
      <a href="options.html" target="_blank" rel="noopener">Ustawienia</a>
    </header>
    <section id="portal" class="portal" hidden aria-label="Dostęp do strony">
      <p id="access" aria-live="polite"></p>
      <button id="enter" type="button" hidden>Otwórz portal</button>
    </section>
    <article aria-labelledby="title">
      <h1 id="title"></h1>
      <div id="text"></div>
    </article>
    <nav aria-label="Nawigacja książki">
      <button id="previous" type="button">Wstecz</button>
      <span id="page"></span>
      <button id="next" type="button">Czytaj dalej</button>
    </nav>
  </main>
</body>
</html>
